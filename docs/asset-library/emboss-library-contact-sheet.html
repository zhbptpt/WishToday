<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WishToday 浮雕素材库</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, "Songti SC", STSong, serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #090604; color: #ead39a; }
      main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
      h1 { margin: 0 0 8px; font-size: 32px; font-weight: 500; letter-spacing: 0; }
      p { margin: 0 0 28px; color: #bda878; line-height: 1.7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
      figure { margin: 0; border: 1px solid #6f4a22; background: #1c110b; border-radius: 6px; overflow: hidden; }
      img { display: block; width: 100%; aspect-ratio: 394 / 932; object-fit: cover; object-position: top; background: #100a06; }
      figure.wide img { aspect-ratio: 1.2; object-fit: contain; }
      figcaption { padding: 14px 16px 16px; line-height: 1.5; }
      small { display: block; margin-top: 4px; color: #9d8352; font-family: Inter, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <h1>WishToday 浮雕素材库</h1>
      <p>深棕皮革书页背景与已确认的浮雕方向应用稿。生产使用前请查看 manifest 中的状态。</p>
      <section class="grid">
        <figure>
          <img src="../../public/assets/emboss-library/backgrounds/leather-book-page.png" alt="深棕皮革书页背景" />
          <figcaption>深棕皮革书页背景<small>production · 815 × 1930</small></figcaption>
        </figure>
        <figure>
          <img src="../../public/assets/emboss-library/reference-sheets/alchemy-page.png" alt="炼金术浮雕应用稿" />
          <figcaption>炼金术浮雕<small>reference · 394 × 932</small></figcaption>
        </figure>
        <figure>
          <img src="../../public/assets/emboss-library/reference-sheets/barware-page.png" alt="调酒器具浮雕应用稿" />
          <figcaption>古老调酒器具浮雕<small>reference · 394 × 932</small></figcaption>
        </figure>
        <figure>
          <img src="../../public/assets/emboss-library/reference-sheets/botanical-page.png" alt="草本植物与星盘浮雕应用稿" />
          <figcaption>草本植物与星盘<small>reference · 394 × 932</small></figcaption>
        </figure>
        <figure>
          <img src="../../public/assets/emboss-library/reference-sheets/botanical-page-refined-2x.png" alt="草本植物与星盘浮雕精修稿" />
          <figcaption>草本植物与星盘精修稿<small>preferred reference · 788 × 1864</small></figcaption>
        </figure>
        <figure class="wide">
          <img src="../../public/assets/emboss-library/reference-sheets/emboss-options-overview.png" alt="浮雕方向总览" />
          <figcaption>浮雕方向总览<small>comparison · 1246 × 1010</small></figcaption>
        </figure>
        <figure class="wide">
          <img src="../../public/assets/emboss-library/reference-sheets/botanical-refinement-comparison.png" alt="草本浮雕精细度对比" />
          <figcaption>草本浮雕精细度对比<small>comparison · 820 × 1010</small></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
