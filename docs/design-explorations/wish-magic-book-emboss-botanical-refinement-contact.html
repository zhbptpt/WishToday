<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>WishToday 植物星盘浮雕精修对比</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #080504; }
      body { padding: 16px; }
      main { display: grid; grid-template-columns: repeat(2, 394px); gap: 16px; }
      figure { margin: 0; }
      figcaption {
        height: 46px;
        padding: 0 4px;
        color: #e7c98b;
        font: 600 18px/46px "Songti SC", STSong, Georgia, serif;
        letter-spacing: 0;
      }
      img {
        display: block;
        width: 394px;
        height: 932px;
        border: 1px solid rgba(183, 123, 40, 0.42);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.56);
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>原版 · 粗线条</figcaption><img src="wish-magic-book-emboss-botanical.png" alt="原版植物星盘浮雕" /></figure>
      <figure><figcaption>精修版 · 细线压印</figcaption><img src="wish-magic-book-emboss-botanical-refined.png" alt="精修版植物星盘浮雕" /></figure>
    </main>
  </body>
</html>
