services:
  - type: web
    name: wishtoday-api-staging
    runtime: node
    region: singapore
    plan: starter
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL_MODE
        value: require
      - key: WISHTODAY_DEPLOYMENT_ENV
        value: staging
      - key: WISHTODAY_DEPLOYMENT_REGION
        value: singapore
      - key: WISHTODAY_DEPLOYMENT_PLAN
        value: starter
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT_BASE64
        sync: false
      - key: JWT_PRIVATE_KEY_BASE64
        sync: false
      - key: JWT_PUBLIC_KEY_BASE64
        sync: false
      - key: JWT_KEY_ID
        sync: false
      - key: TOKEN_PEPPER
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
